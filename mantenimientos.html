<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimientos Produccion Academica CENFOTEC</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link href="css/estilos.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<main class="container my-4">
  <h1 class="texto-marca mb-3">Mantenimientos</h1>
  <div id="bloqueado" class="alert alert-warning d-none">
    No tenes permisos para administrar mantenimientos con el rol actual
  </div>

  <div class="row g-3" id="contenido-mant">
    <div class="col-lg-3">
      <div class="list-group menu-mant" id="menu-catalogos"></div>
      <div class="card tarjeta mt-3">
        <div class="card-body">
          <p class="small text-muted mb-2">Restablecer  datos </p>
          <button class="btn btn-sm btn-outline-secondary w-100" id="btn-reiniciar">
            <i class="bi bi-arrow-counterclockwise"></i> Reiniciar datos
          </button>
        </div>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="card tarjeta">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="texto-marca mb-0" id="titulo-catalogo"></h4>
            <button class="btn btn-marca" id="btn-nuevo-mant"><i class="bi bi-plus-lg"></i> Nuevo</button>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle tabla-marca">
              <thead id="cabecera-mant"></thead>
              <tbody id="cuerpo-mant"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="modal fade" id="modal-mant" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header marca-nav text-white">
        <h5 class="modal-title" id="titulo-modal-mant">Nuevo registro</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="form-mant" novalidate>
          <input type="hidden" id="m-id">
          <div id="campos-mant"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-marca" id="btn-guardar-mant">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div id="pie"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/datos.js"></script>
<script src="js/auth.js"></script>
<script src="js/comun.js"></script>
<script src="js/mantenimientos.js"></script>
</body>
</html>
